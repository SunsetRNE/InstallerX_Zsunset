name: 打包模块

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 读取版本号
        id: version
        run: |
          echo "version=$(grep '^version=' module.prop | cut -d= -f2)" >> $GITHUB_OUTPUT
          echo "versionCode=$(grep '^versionCode=' module.prop | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: 打包模块
        run: |
          mkdir -p output
          cd "${{ github.workspace }}"
          zip -r "output/InstallerX_Zsunset-v${{ steps.version.outputs.version }}.zip" . \
            -x ".git/*" \
            -x ".github/*" \
            -x "README.md"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: InstallerX_Zsunset-v${{ steps.version.outputs.version }}
          path: output/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" \
            output/InstallerX_Zsunset-v${VERSION}.zip \
            --title "InstallerX Zsunset v${VERSION}" \
            --notes "模块版本：v${VERSION}（code ${{ steps.version.outputs.versionCode }}）
                    基于 wxxsfxyzm/InstallerX-Revived 项目
                    ZIP 结构无外层文件夹，可直接刷入"
        env:
          GH_TOKEN: ${{ github.token }}